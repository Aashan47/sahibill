[project]
name = "sahibill"
version = "0.1.0"
description = "Checks a Pakistani household electricity bill against NEPRA's own rules"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pillow>=10", "numpy>=1.26", "playwright>=1.45", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]
voice = ["modal==1.6.2"]   # live speech (Omnilingual ASR on Modal)

[tool.setuptools]
packages = ["sahibill", "sahibill.synth", "sahibill.rules", "sahibill.complaint", "sahibill.readers", "sahibill.speech", "sahibill.vision"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
